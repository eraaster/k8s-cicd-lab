apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-api
  labels:
    app: nginx-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-api
  template:
    metadata:
      labels:
        app: nginx-api
    spec:
      containers:
      - name: nginx
        # Actions가 새 SHA 태그로 이 줄을 바꿔서 commit함
        image: ghcr.io/eraaster/nginx-api:4062cbb48d42719c50576014d2bda94e5fb999fd
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
